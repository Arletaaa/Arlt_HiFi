appId: com.arlthifi
productName: Arlt-HiFi
copyright: Copyright © 2026 Arlt-HiFi
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # renderer 与主进程都已由 Vite/esbuild 打包，生产依赖不需要再进 asar。
  - "!node_modules/**/*"
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: arlt-hifi-${version}-setup.exe
  include: installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  # 路径选择由 build/installer.nsh 的自定义页接管（安装位置 + 曲库位置，均自动新建子文件夹）。
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Arlt-HiFi
  uninstallDisplayName: Arlt-HiFi
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  language: "2052"
  license: ../../LICENSE
